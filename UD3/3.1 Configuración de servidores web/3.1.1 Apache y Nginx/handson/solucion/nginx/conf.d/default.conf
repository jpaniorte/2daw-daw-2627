server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    location /miniatura/ {
        alias /usr/share/nginx/html/img/;
        image_filter resize $arg_w -;
        image_filter_buffer 10M;
    }

    location = /hola {
        js_content hola.saludo;
    }
}
